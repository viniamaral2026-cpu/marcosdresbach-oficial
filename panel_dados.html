<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcos Dresbach — Painel de Dados (Standalone)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDqDQz2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0" integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzb0ec3Gs9fQ4IzR" crossorigin="anonymous"></style>
    <style>
        :root { --bg-primary: #0d1b2a; --bg-card: #142238; --bg-header: #0a1420; --text-primary: #cbd5e1; --text-secondary: #6c757d; --text-on-dark: #fff; --color-1: #f97316; --color-2: #fb923c; --color-3: #ffd9b0; --color-4: #a855f6; --color-5: #22c55e; --color-6: #eab308; --positive: #28a745; --negative: #dc3545; --neutral: #6c757d; --gap: 16px; --radius: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; }
        .panel { max-width: 1000px; margin: 20px auto; }
        .panel h2 { color: var(--text-primary); border-bottom: 1px solid var(--bg-header); padding-bottom: 8px; margin-bottom: 12px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
        .stat-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--color-1); }
        .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
        .stat-trend { font-size: 11px; margin-top: 4px; }
        .stat-trend.positive { color: var(--positive); }
        .stat-trend.negative { color: var(--negative); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 20px 0; }
        th { padding: 8px 8px; border-bottom: 1px solid var(--bg-header); color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
        td { padding: 8px 8px; border-bottom: 1px solid #334a5c; }
        tr:hover td { background: #1a2d40; }
        @media (max-width: 600px) { .stat-card { padding: 12px; } }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Marcos Dresbach — Estátísticas Gerais</h2>

        <div class="stats">
            <div class="stat-card"><div class="stat-label">Páginas Web</div><div class="stat-value" id="web-pages">4</div><div class="stat-trend positive">+0 desde 2024</div></div>
            <div class="stat-card"><div class="stat-label">Migrações BD</div><div class="stat-value" id="db-migrations">11</div><div class="stat-trend positive">✓ Todas concluídas</div></div>
            <div class="stat-card"><div class="stat-label">Arquivos CSS</div><div class="stat-value" id="css-files">1</div><div class="stat-trend positive">Global stylesheet</div></div>
            <div class="stat-card"><div class="stat-label">Componentes Astro</div><div class="stat-value" id="astro-comps">5</div><div class="stat-trend positive">Header, Footer, Icons, Base, Pages</div></div>
        </div>

        <h3>Visão Geral das Páginas</h3>
        <table>
            <thead>
                <tr><th>Página</th><th>URL</th><th>Categoria</th><th>Status</th></tr>
            </thead>
            <tbody>
                <tr><td>Início</td><td>/</td><td>Home</td><td>✓ Ativa</td></tr>
                <tr><td>Sobre</td><td>/sobre</td><td>Institucional</td><td>✓ Ativa</td></tr>
                <tr><td>Contato</td><td>/contato</td><td>Contato</td><td>✓ Ativa</td></tr>
                <tr><td>Instituto</td><td>/instituto</td><td>Memorial</td><td>✓ Ativa</td></tr>
            </tbody>
        </table>

        <h3>Componentes do Front-end</h3>
        <ul style="color: var(--text-secondary); line-height: 1.8;">
            <li><strong>Header.astro</strong> - Navigação principal com menu dropdown</li>
            <li><strong>Footer.astro</strong> - Rodapé com redes sociais e contatos</li>
            <li><strong>Icons.astro</strong> - Símbolos SVG (23 símbolos)</li>
            <li><strong>Base.astro</strong> - Template layout wrapper com scripts interativos</li>
            <li><strong>4 páginas</strong> - index, sobre, contato, instituto</li>
        </ul>

        <h3>Backend (Laravel)</h3>
        <ul style="color: var(--text-secondary); line-height: 1.8;">
            <li>11 migrações de banco de dados completas</li>
            <li>Modelos: User (com hashing de senha)</li>
            <li>Migrações completas: users, roles, permissions, genealogy, encyclopedia, sources, archive, documents, media, search contributions system</li>
            <li>PHPUnit: 2 testes passando</li>
        </ul>
    </div>
    <script>
        // KPI interatividade simples
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-4px)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
